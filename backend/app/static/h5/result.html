<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>提交成功</title>
    <link rel="stylesheet" href="https://unpkg.com/vant@4/lib/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #F7F8FA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }
        .page-wrap { max-width: 750px; margin: 0 auto; padding-bottom: 40px; }
        .success-notice { background: #07C160; color: #fff; padding: 12px 16px; font-size: 15px; font-weight: 500; }
        .card { margin: 12px; border-radius: 8px; overflow: hidden; }
        .ticket-id { font-size: 20px; font-weight: 700; color: #333; }
        .ticket-id-copy { font-size: 12px; color: #1989FA; margin-left: 8px; cursor: pointer; }
        .ai-reply-content { padding: 12px 16px; color: #333; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
        .ai-reply-footer { padding: 8px 16px; font-size: 12px; color: #999; border-top: 1px solid #f5f5f5; }
        .tip-box { margin: 12px; padding: 12px 16px; border-radius: 8px; font-size: 13px; line-height: 1.6; }
        .tip-high { background: #FFF0F0; color: #CC3333; border-left: 3px solid #FF4444; }
        .tip-medium { background: #FFF8E1; color: #B36B00; border-left: 3px solid #FF9800; }
        .tip-low { background: #F0FFF0; color: #2E7D32; border-left: 3px solid #4CAF50; }
        .bottom-actions { display: flex; gap: 12px; padding: 16px 12px; }
        .bottom-actions .van-button { flex: 1; }
        .no-data { text-align: center; padding: 60px 20px; }
        .no-data p { color: #999; font-size: 14px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div id="app" class="page-wrap">
        <template v-if="ticketData">
            <div class="success-notice">✅ 客诉已提交成功</div>

            <div class="card">
                <van-cell-group inset>
                    <van-cell title="工单编号">
                        <template #value>
                            <span class="ticket-id">{{ ticketData.ticket_id }}</span>
                            <span class="ticket-id-copy" @click="copyTicketId">复制</span>
                        </template>
                    </van-cell>
                    <van-cell title="紧急度">
                        <template #value>
                            <van-tag :type="urgencyTagType" size="medium">{{ ticketData.urgency_label }}</van-tag>
                        </template>
                    </van-cell>
                    <van-cell title="问题分类" :value="ticketData.issue_category_label" />
                    <van-cell title="当前状态" :value="ticketData.status_label" />
                    <van-cell title="提交时间" :value="formatTime(ticketData.created_at)" />
                </van-cell-group>
            </div>

            <div class="card">
                <van-cell-group inset>
                    <van-cell title="🤖 AI智能回复" />
                    <div class="ai-reply-content">{{ ticketData.auto_reply }}</div>
                    <div class="ai-reply-footer">此回复由AI自动生成，仅供参考</div>
                </van-cell-group>
            </div>

            <div class="card">
                <van-cell-group inset>
                    <van-cell title="处理进度" />
                    <van-steps direction="vertical" :active="activeStep" active-color="#1989FA">
                        <van-step v-for="(step, idx) in steps" :key="idx">
                            <template #active-icon>
                                <span v-if="step.icon === 'high'" style="color:#FF4444;font-size:16px;">🔴</span>
                                <span v-else>🔄</span>
                            </template>
                            <h4>{{ step.title }}</h4>
                        </van-step>
                    </van-steps>
                </van-cell-group>
            </div>

            <div :class="['tip-box', tipClass]">
                {{ tipText }}
            </div>

            <div class="bottom-actions">
                <van-button plain type="primary" @click="goHome">返回首页</van-button>
                <van-button type="primary" @click="goQuery">查询最新进度</van-button>
            </div>
        </template>

        <template v-else>
            <div class="no-data">
                <p>未找到工单信息</p>
                <van-button type="primary" @click="goHome">返回首页</van-button>
            </div>
        </template>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/vant@4/lib/vant.min.js"></script>
    <script>
        async function apiGetTicket(ticketId) {
            const resp = await fetch(`/api/v1/customer/ticket/${ticketId}`);
            const json = await resp.json();
            if (json.code === 0) return json.data;
            throw new Error(json.message || '查询失败');
        }

        function formatTime(isoStr) {
            if (!isoStr) return '-';
            const d = new Date(isoStr);
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        const app = Vue.createApp({
            data() {
                return {
                    ticketData: null
                };
            },
            computed: {
                urgencyTagType() {
                    const map = {
                        'High_Priority': 'danger',
                        'Medium_Priority': 'warning',
                        'Low_Priority': 'success'
                    };
                    return map[this.ticketData?.urgency_level] || 'default';
                },
                steps() {
                    if (!this.ticketData) return [];
                    const urgency = this.ticketData.urgency_level;
                    const isHigh = urgency === 'High_Priority';
                    return [
                        { title: '客诉已接收', icon: 'done' },
                        { title: 'AI智能定级', icon: 'done' },
                        { title: isHigh ? '已触发最高级响应' : '路由分发中', icon: isHigh ? 'high' : 'active' }
                    ];
                },
                activeStep() {
                    return 2;
                },
                tipClass() {
                    const map = {
                        'High_Priority': 'tip-high',
                        'Medium_Priority': 'tip-medium',
                        'Low_Priority': 'tip-low'
                    };
                    return map[this.ticketData?.urgency_level] || 'tip-low';
                },
                tipText() {
                    const map = {
                        'High_Priority': '⚠ 为保障您的安全，请按AI回复指引操作，我们的技术总监将于30分钟内与您联系。',
                        'Medium_Priority': '我们的技术人员正在处理，将在2小时内与您联系。',
                        'Low_Priority': '我们已为您安排处理，将在24小时内完成。'
                    };
                    return map[this.ticketData?.urgency_level] || map['Low_Priority'];
                }
            },
            methods: {
                formatTime,
                copyTicketId() {
                    if (navigator.clipboard && this.ticketData) {
                        navigator.clipboard.writeText(this.ticketData.ticket_id).then(() => {
                            vant.showToast('已复制');
                        }).catch(() => {
                            vant.showToast('复制失败');
                        });
                    }
                },
                goHome() {
                    window.location.href = 'index.html';
                },
                goQuery() {
                    if (this.ticketData) {
                        window.location.href = `query.html?ticket_id=${this.ticketData.ticket_id}`;
                    }
                },
                async loadData() {
                    const stored = sessionStorage.getItem('complaint_result');
                    if (stored) {
                        try {
                            this.ticketData = JSON.parse(stored);
                            return;
                        } catch (e) {}
                    }

                    const params = new URLSearchParams(window.location.search);
                    const ticketId = params.get('ticket_id');
                    if (ticketId) {
                        try {
                            this.ticketData = await apiGetTicket(ticketId);
                        } catch (e) {
                            vant.showToast(e.message || '查询失败');
                        }
                    }
                }
            },
            mounted() {
                this.loadData();
            }
        });

        app.use(vant);
        app.mount('#app');
    </script>
</body>
</html>
