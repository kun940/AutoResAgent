<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工单进度查询</title>
    <link rel="stylesheet" href="https://unpkg.com/vant@4/lib/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #F7F8FA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }
        .page-wrap { max-width: 750px; margin: 0 auto; padding-bottom: 40px; }
        .header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
        .header-inner { background: #1989FA; color: #fff; display: flex; align-items: center; padding: 14px 16px; max-width: 750px; margin: 0 auto; }
        .header-back { font-size: 20px; cursor: pointer; margin-right: 8px; flex-shrink: 0; }
        .header-title { font-size: 17px; font-weight: 600; letter-spacing: 1px; }
        .content { padding-top: 50px; }
        .search-area { padding: 12px 12px 0; }
        .card { margin: 12px; border-radius: 8px; overflow: hidden; }
        .ticket-id { font-size: 18px; font-weight: 700; color: #333; }
        .ticket-id-copy { font-size: 12px; color: #1989FA; margin-left: 8px; cursor: pointer; }
        .ai-reply-content { padding: 12px 16px; color: #333; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
        .ai-reply-footer { padding: 8px 16px; font-size: 12px; color: #999; border-top: 1px solid #f5f5f5; }
        .bottom-actions { display: flex; gap: 12px; padding: 16px 12px; }
        .bottom-actions .van-button { flex: 1; }
        .timeline-time { font-size: 12px; color: #999; }
        .timeline-event { font-size: 14px; }
        .timeline-event-active { color: #1989FA; font-weight: 600; }
    </style>
</head>
<body>
    <div id="app" class="page-wrap">
        <div class="header">
            <div class="header-inner">
                <span class="header-back" @click="goHome">←</span>
                <span class="header-title">工单进度查询</span>
            </div>
        </div>

        <div class="content">
            <div class="search-area">
                <van-search
                    v-model="searchValue"
                    placeholder="请输入工单号，如 CS-20260527-001"
                    show-action
                    action-text="查询"
                    @search="onSearch"
                    @cancel="onSearch"
                    :loading="searching"
                ></van-search>
            </div>

            <template v-if="ticketData">
                <div class="card">
                    <van-cell-group inset>
                        <van-cell title="工单编号">
                            <template #value>
                                <span class="ticket-id">{{ ticketData.ticket_id }}</span>
                                <span class="ticket-id-copy" @click="copyTicketId">复制</span>
                            </template>
                        </van-cell>
                        <van-cell title="紧急度">
                            <template #value>
                                <van-tag :type="urgencyTagType" size="medium">{{ ticketData.urgency_label }}</van-tag>
                            </template>
                        </van-cell>
                        <van-cell title="问题分类" :value="ticketData.issue_category_label" />
                        <van-cell title="当前状态" :value="ticketData.status_label" />
                        <van-cell title="提交时间" :value="formatDateTime(ticketData.created_at)" />
                    </van-cell-group>
                </div>

                <div class="card">
                    <van-cell-group inset>
                        <van-cell title="处理时间线" />
                        <van-steps direction="vertical" :active="activeTimeline" active-color="#1989FA">
                            <van-step v-for="(item, idx) in ticketData.timeline" :key="idx">
                                <h4 :class="{'timeline-event-active': item.status === 'active'}">{{ item.event }}</h4>
                                <p class="timeline-time">{{ item.time || '--:--' }}</p>
                            </van-step>
                        </van-steps>
                    </van-cell-group>
                </div>

                <div class="card">
                    <van-cell-group inset>
                        <van-collapse v-model="activeCollapse">
                            <van-collapse-item title="🤖 AI智能回复" name="reply">
                                <div class="ai-reply-content">{{ ticketData.auto_reply }}</div>
                                <div class="ai-reply-footer">此回复由AI自动生成，仅供参考</div>
                            </van-collapse-item>
                        </van-collapse>
                    </van-cell-group>
                </div>

                <div class="bottom-actions">
                    <van-button plain type="primary" @click="goHome">返回首页</van-button>
                    <van-button type="primary" @click="refreshTicket">刷新进度</van-button>
                </div>
            </template>

            <template v-else>
                <van-empty :image="emptyImage" :description="emptyDesc" />
            </template>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/vant@4/lib/vant.min.js"></script>
    <script>
        async function apiGetTicket(ticketId) {
            const resp = await fetch(`/api/v1/customer/ticket/${ticketId}`);
            const json = await resp.json();
            if (json.code === 0) return json.data;
            if (json.code === 1) throw new Error('NOT_FOUND');
            throw new Error(json.message || '查询失败');
        }

        function formatDateTime(isoStr) {
            if (!isoStr) return '-';
            const d = new Date(isoStr);
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        const app = Vue.createApp({
            data() {
                return {
                    searchValue: '',
                    searching: false,
                    ticketData: null,
                    notFound: false,
                    activeCollapse: ['reply']
                };
            },
            computed: {
                urgencyTagType() {
                    const map = {
                        'High_Priority': 'danger',
                        'Medium_Priority': 'warning',
                        'Low_Priority': 'success'
                    };
                    return map[this.ticketData?.urgency_level] || 'default';
                },
                activeTimeline() {
                    if (!this.ticketData || !this.ticketData.timeline) return 0;
                    const idx = this.ticketData.timeline.findIndex(t => t.status === 'active');
                    if (idx !== -1) return idx;
                    return this.ticketData.timeline.length;
                },
                emptyImage() {
                    return this.notFound ? 'error' : 'search';
                },
                emptyDesc() {
                    return this.notFound ? '未找到该工单，请检查工单号是否正确' : '请输入工单号查询处理进度';
                }
            },
            methods: {
                async onSearch() {
                    const ticketId = this.searchValue.trim();
                    if (!ticketId) {
                        vant.showToast('请输入工单号');
                        return;
                    }
                    if (!ticketId.startsWith('CS-')) {
                        vant.showToast('工单号格式不正确，应以CS-开头');
                        return;
                    }

                    this.searching = true;
                    this.notFound = false;
                    try {
                        this.ticketData = await apiGetTicket(ticketId);
                    } catch (e) {
                        if (e.message === 'NOT_FOUND') {
                            this.notFound = true;
                            this.ticketData = null;
                        } else if (e.message && e.message.includes('Failed to fetch')) {
                            vant.showToast('网络异常，请检查网络连接');
                        } else {
                            vant.showToast(e.message || '查询失败');
                        }
                    } finally {
                        this.searching = false;
                    }
                },
                copyTicketId() {
                    if (navigator.clipboard && this.ticketData) {
                        navigator.clipboard.writeText(this.ticketData.ticket_id).then(() => {
                            vant.showToast('已复制');
                        }).catch(() => {
                            vant.showToast('复制失败');
                        });
                    }
                },
                goHome() {
                    window.location.href = 'index.html';
                },
                async refreshTicket() {
                    if (this.ticketData) {
                        this.searchValue = this.ticketData.ticket_id;
                        await this.onSearch();
                        vant.showToast('已刷新');
                    }
                },
                checkUrlParams() {
                    const params = new URLSearchParams(window.location.search);
                    const ticketId = params.get('ticket_id');
                    if (ticketId) {
                        this.searchValue = ticketId;
                        this.onSearch();
                    }
                }
            },
            mounted() {
                this.checkUrlParams();
            }
        });

        app.use(vant);
        app.mount('#app');
    </script>
</body>
</html>
